name = "programmable-portfolio-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 3000
local_protocol = "http"

# D1 is Cloudflare's managed SQLite.
# Local `wrangler dev` uses a local SQLite file — no system SQLite install needed.
# After `npm run db:create`, replace database_id with the ID Wrangler prints.
[[d1_databases]]
binding = "DB"
database_name = "programmable-portfolio"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "development"
CORS_ORIGIN = "http://localhost:5173"
PROGRAM_ID = "55SD6QmpgygjDqLG3fzcbMvFEdPT4LozjAvPwcJQZXM5"
SOLANA_RPC_URL = "https://api.devnet.solana.com"

# Workers AI binding (preferred provider for /ai/chat and /ai/compile)
[ai]
binding = "AI"

# Advance mock prices on a schedule (GET /prices also ensureFresh every ~15s)
[triggers]
crons = ["*/1 * * * *"]
