[features]
resolution = true
skip-lint = false

[programs.localnet]
mera_portfolio = "55SD6QmpgygjDqLG3fzcbMvFEdPT4LozjAvPwcJQZXM5"

[programs.devnet]
mera_portfolio = "55SD6QmpgygjDqLG3fzcbMvFEdPT4LozjAvPwcJQZXM5"

[programs.mainnet]
mera_portfolio = "55SD6QmpgygjDqLG3fzcbMvFEdPT4LozjAvPwcJQZXM5"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

# Intentionally no [toolchain] block.
# AVM's toolchain pin re-runs `agave-install` and breaks shells where Solana
# isn't on PATH yet. Use system Anchor 0.31.1 + Solana 2.2.x instead.
