[package]
name = "mera_portfolio"
version = "0.1.0"
description = "Programmable portfolio vault for tokenized stocks + rules autopilot"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mera_portfolio"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", default-features = false, features = [
  "token",
  "token_2022",
  "associated_token",
] }


